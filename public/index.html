<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#f7f4ee" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>狼人杀 · AI 主持人</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-name">狼人杀</span>
      <span class="day-chip" id="dayChip">未连接</span>
    </div>
    <div class="top-actions">
      <span class="watch-tag" id="watchTag" hidden>观战</span>
      <button class="ghost-btn" id="roleBtn" hidden>身份</button>
      <button class="ghost-btn" id="logBtn">记录</button>
      <button class="ghost-btn" id="micBtn">连麦</button>
      <button class="ghost-btn" id="soundBtn">语音开</button>
    </div>
  </header>

  <!-- 入口 -->
  <section class="screen on" id="entryScreen">
    <div class="entry">
      <h1 class="entry-title">狼人杀</h1>
      <p class="entry-lead">AI 主持人控场，人数不够由 AI 补位。<br>6 人局，一局大约 10 分钟。</p>

      <label class="field">
        <span>你的昵称</span>
        <input id="nameInput" maxlength="8" placeholder="输入昵称，最多 8 个字" />
      </label>

      <button class="block-btn primary" id="createBtn">创建房间</button>

      <div class="divider"><span>或者加入朋友的局</span></div>

      <label class="field">
        <span>房间号</span>
        <input id="codeInput" inputmode="numeric" maxlength="4" placeholder="4 位数字" />
      </label>
      <button class="block-btn outline" id="joinBtn">加入房间</button>
      <button class="watch-btn" id="watchBtn">只想旁观？进房观战（不占座位、不下场）</button>

      <p class="dock-note" id="entryHint">同一 WiFi 下，朋友打开你的链接就能进。</p>
      <button class="voice-mode" id="voiceModeBtn">语音：真人音色</button>
    </div>
  </section>

  <!-- 房间等待 -->
  <section class="screen" id="lobbyScreen">
    <div class="lobby-head">
      <div class="lobby-code">
        <span class="label">房间号</span>
        <b id="roomCode">----</b>
      </div>
      <div class="lobby-actions">
        <button class="ghost-btn" id="copyBtn">复制邀请链接</button>
        <button class="ghost-btn danger" id="quitBtn">退出</button>
      </div>
    </div>

    <div class="lobby-list" id="lobbyList"></div>

    <div class="dock" id="lobbyDock"></div>
  </section>

  <!-- 对局 -->
  <section class="screen" id="gameScreen">
    <div class="table-wrap">
      <div class="table-circle">
        <div class="table-inner">
          <div class="table-label" id="tableLabel">准备中</div>
          <div class="table-sub" id="tableSub">等待开始</div>
        </div>
      </div>
      <div class="seats" id="seats"></div>
    </div>

    <div class="wolf-bar" id="wolfBar" hidden>
      <span class="wolf-dot"></span>
      <span>狼队频道已开 · 只有狼队友听得到你</span>
    </div>

    <div class="speak-timer" id="speakTimerBar" hidden>
      <div class="st-head">
        <span class="st-name" id="stName">发言</span>
        <span class="st-num" id="stNum">30</span>
      </div>
      <div class="st-track"><i id="stFill"></i></div>
    </div>

    <div class="host-bar">
      <span class="host-dot" id="hostDot"></span>
      <div class="host-body">
        <div class="host-tag">主持人</div>
        <div class="host-text" id="hostText" aria-live="polite">等人到齐就可以开始了。</div>
      </div>
    </div>

    <div class="dock" id="gameDock"></div>

    <div class="bubble" id="bubble" hidden>
      <div class="bubble-head">
        <span class="bubble-name" id="bubbleName"></span>
        <span class="bubble-tag" id="bubbleTag">发言</span>
      </div>
      <div class="bubble-text" id="bubbleText"></div>
    </div>
  </section>
</div>

<!-- 开局身份揭晓 -->
<div class="role-intro" id="roleIntro" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="role-card">
    <div class="role-kicker">你当前的用户身份是</div>
    <div class="role-name" id="roleIntroName">村民</div>
    <div class="role-meta">
      <span class="role-camp good" id="roleIntroCamp">好人阵营</span>
      <span class="role-seat" id="roleIntroSeat">第 1 号位</span>
    </div>
    <div class="role-tip" id="roleIntroTip"></div>
    <button class="block-btn primary" id="roleIntroOk">知道了，开始游戏</button>
    <p class="role-note">身份随时可以在右上角「身份」里再查看</p>
  </div>
</div>

<!-- 弹层 -->
<div class="sheet-mask" id="mask" aria-hidden="true">
  <div class="sheet" id="sheet"></div>
</div>

<!-- 记录 -->
<div class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <span>发言记录</span>
    <button class="ghost-btn" id="drawerClose">关闭</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<!-- 结算 -->
<div class="result" id="result" aria-hidden="true"></div>

<!-- 轻提示 -->
<div class="toast" id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
